# Continuous verification for dsh-edit-approval: typecheck, tests, a full
# build with artifact verification, and tarball completeness on every push
# and pull request — before any publish.
#
# Node 22 (the engines lower bound ^22.19.0) covers the supported floor;
# the publish workflow pins Node 24 for the OIDC requirement instead.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (full, with .d.ts) and verify built artifact
        run: npm run build && node scripts/verify-host.mjs

      - name: Pack sanity (tarball must contain lib/ and LICENSE)
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'lib/index.js' /tmp/pack.txt
          grep -q 'lib/types/index.d.ts' /tmp/pack.txt
          grep -q 'lib/client.js' /tmp/pack.txt
          grep -q 'LICENSE' /tmp/pack.txt
